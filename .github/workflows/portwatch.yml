name: PortWatch transits

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portwatch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch PortWatch
        run: python portwatch.py
      - run: pip install pillow
      - name: Make share cards
        run: python make_cards.py
      - name: Commit data
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add data cards
          git diff --staged --quiet || (git commit -m "Update PortWatch data" && git pull --rebase && git push)
