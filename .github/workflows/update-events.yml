name: Update events (AI)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests anthropic
      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper_v2.py
      - name: Commit changes
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add events.json cache.json
          git diff --staged --quiet || (git commit -m "Update events" && git pull --rebase && git push)
