name: Central bank crux

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crux
  cancel-in-progress: false

jobs:
  crux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Summarise new RBI / Fed documents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python crux.py
      - name: Commit data
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update central bank crux" && git pull --rebase && git push)
